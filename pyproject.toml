[project]
name = "luopita"
version = "0.2.0"
description = "Human-like QQ group chatbot kernel: NapCat/OneBot, LangGraph agent, per-speaker context shards, Redis + Postgres/pgvector."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rovina" }]
keywords = [
    "qq-bot",
    "napcat",
    "onebot",
    "langgraph",
    "fastapi",
    "chatbot",
    "pgvector",
    "group-chat",
]
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langchain>=1.2.12",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "openai>=2.14.0",
    "psycopg-pool>=3.2.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.12.5",
    "pyfiglet>=1.0.4",
    "pyyaml>=6.0.3",
    "redis[hiredis]>=5.0.0",
    "rich>=13.9.0",
    "textual>=6.11.0",
    "textual-dev>=1.8.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
]

[dependency-groups]
docs = [
    "mkdocs-material>=9.6.0",
]
